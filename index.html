<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Future Woman Application</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent-color: #d32f2f;
      --accent-gold: #ffb300;
      --text-main: #e0e0e0;
      --text-muted: #a0a0a0;
      --border-color: #333333;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 680px;
      width: 100%;
      padding: 20px 16px 120px 16px;
    }

    .header {
      text-align: center;
      padding: 24px 0 12px 0;
      border-bottom: 2px solid var(--accent-color);
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 26px;
      margin: 0 0 8px 0;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
      margin: 0;
    }

    .section-title {
      font-size: 18px;
      font-weight: 700;
      color: var(--accent-gold);
      margin: 32px 0 16px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 6px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .question-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 12px;
      color: #fff;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .option-btn {
      background-color: #2a2a2a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      padding: 10px 12px;
      font-size: 13px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      border-color: var(--accent-gold);
    }

    .option-btn.selected {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
      font-weight: 600;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      cursor: pointer;
      margin-bottom: 8px;
    }

    .custom-input {
      width: 100%;
      background-color: #2a2a2a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      padding: 10px;
